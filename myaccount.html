    </button>

</section>

<script src="app.js"></script>

<script>
  function updateAccount(){
    let total = 0;

    cart.forEach(i => total += i.price);

    const v = document.getElementById("cartValue");
    if(v) v.innerText = total.toFixed(2) + " zł";

    const o = document.getElementById("ordersCount");
    if(o) o.innerText = cart.length;
  }

  updateAccount();
</script>
