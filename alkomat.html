<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Alkomat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Alkomat</h1>

  <input id="weight" placeholder="waga">
  <input id="drinks" placeholder="ilość drinków">
  <button onclick="calc()">Oblicz</button>

  <h2 id="res"></h2>
</div>

<script>
function calc() {
  let w = document.getElementById("weight").value;
  let d = document.getElementById("drinks").value;

  let result = (d * 10) / w;

  document.getElementById("res").innerText =
    "Szacowany poziom: " + result.toFixed(2) + "‰";
}
</script>

</body>
</html>
