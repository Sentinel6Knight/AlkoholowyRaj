<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>AlkoShop ONE PAGE</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- NAV (tylko przewijanie) -->
<div class="navbar">
  <div>🍺 AlkoShop</div>
  <div>🛒 <span id="cartCount">0</span></div>
</div>

<!-- HERO -->
<section class="hero">
  <h1>AlkoShop</h1>
  <p>Jedna strona – wszystko</p>
</section>

<!-- SLIDER -->
<section class="block">
  <img id="slider" src="MainPage_1.jpg" width="100%">
</section>

<!-- SKLEP -->
<section class="block">
  <h2>Sklep</h2>

  <div class="card">
    <img src="JohnnieWalker.jpg">
    <p>Johnnie Walker</p>
    <button onclick="addToCart('Johnnie Walker',79.99)">Dodaj</button>
  </div>

  <div class="card">
    <img src="MainPage_1.jpg">
    <p>Red Wine</p>
    <button onclick="addToCart('Wine',49.99)">Dodaj</button>
  </div>

  <div class="card">
    <img src="MainPage_2.jpg">
    <p>Vodka</p>
    <button onclick="addToCart('Vodka',59.99)">Dodaj</button>
  </div>

</section>

<!-- KOSZYK -->
<section class="block">
  <h2>Koszyk</h2>
  <div id="cartItems"></div>
  <h3 id="total"></h3>
</section>

<!-- ALKOMAT -->
<section class="block">
  <h2>Alkomat</h2>

  <input id="w" placeholder="waga">
  <input id="d" placeholder="drinki">
  <input id="h" placeholder="godziny">

  <button onclick="calc()">Oblicz</button>

  <h3 id="r"></h3>
</section>

<!-- KONTO -->
<section class="block">
  <h2>Konto</h2>
  <p>Użytkownik: Guest</p>
  <p>Produkty w koszyku: <span id="accCount">0</span></p>
</section>

<!-- ADMIN -->
<section class="block">
  <h2>Admin</h2>
  <p>Ilość zamówień: <span id="adminCount">0</span></p>
</section>

<script src="app.js"></script>

</body>
</html>
